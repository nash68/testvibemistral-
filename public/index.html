<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Mistral</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
      main { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; }
      h1 { font-size: 1.1rem; }
      #log { flex: 1; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; background: #fff; padding: 12px; }
      .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
      .user { background: #e3f2fd; margin-left: 48px; }
      .assistant { background: #f1f1f1; margin-right: 48px; }
      .error { background: #fdecea; color: #b71c1c; }
      form { display: flex; gap: 8px; margin-top: 12px; }
      input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; background: #ff7000; color: #fff; font-size: 1rem; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <h1>Chat Mistral (mistral-small-latest)</h1>
      <div id="log"></div>
      <form id="form">
        <input id="input" placeholder="Votre message…" autocomplete="off" autofocus />
        <button id="send">Envoyer</button>
      </form>
    </main>
    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const history = [];

      function addMessage(role, text, cls = role) {
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const content = input.value.trim();
        if (!content) return;
        input.value = "";
        send.disabled = true;
        addMessage("user", content);
        history.push({ role: "user", content });
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Erreur serveur");
          const reply = data.content || "(réponse vide)";
          history.push({ role: "assistant", content: reply });
          addMessage("assistant", reply);
        } catch (err) {
          addMessage("error", err.message);
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
